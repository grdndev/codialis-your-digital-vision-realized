<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable | Codialis</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
      }
      .cod-not-found {
        align-items: center; display: flex; justify-content: center; min-height: calc(100vh - 300px);
        padding: 24px; text-align: center;
      }
      .code { font-family: "Space Grotesk", sans-serif; font-size: 96px; font-weight: 700; color: #2fed7f; margin: 0; line-height: 1; }
      h1 { font-family: "Space Grotesk", sans-serif; font-size: 28px; margin: 16px 0 8px; }
      p { color: #9fb0c3; max-width: 480px; margin: 0 auto 28px; line-height: 1.6; }
      .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-block; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 500;
        background: #2fed7f; color: #08111e;
      }
      a.ghost { background: transparent; color: #2fed7f; border: 1px solid rgba(47, 237, 127, 0.4); }
    </style>
    <script src="./site-chrome.js" defer></script>
  </head>
  <body>
    <div data-cod-header></div>
    <main class="cod-not-found">
      <div>
        <p class="code">404</p>
        <h1>Cette page n'existe pas.</h1>
        <p>L'adresse demandée est introuvable — elle a peut-être été déplacée ou supprimée. Retournez à l'accueil ou parlez-nous de votre projet.</p>
        <div class="links">
          <a class="btn" href="/">Retour à l'accueil</a>
          <a class="btn ghost" href="/contact">Nous contacter</a>
          <a class="btn ghost" href="/portfolio">Voir nos réalisations</a>
        </div>
      </div>
    </main>
    <div data-cod-footer></div>
  </body>
</html>
