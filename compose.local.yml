# Pile de développement locale : MySQL + API + les deux frontends.
#
#   docker compose -f compose.local.yml up -d --build
#
#   http://localhost:3001  site vitrine (Apache, /api relayé vers l'API)
#   http://localhost:3002  back-office (frontend-admin)
#
# Le schéma est appliqué au démarrage du backend. Pour les comptes et données
# de démonstration, une fois la pile levée :
#
#   docker compose -f compose.local.yml exec backend npx tsx prisma/seed.ts
#
# Le site vitrine DOIT rester sur le port 3001 : son JavaScript teste
# `location.port === '3001'` pour décider d'appeler /api en relatif plutôt que
# le domaine de production. Apache relaie donc /api vers l'API, ce qui garde le
# site en une seule origine (voir compose-proxy.conf).
services:
  db:
    image: mysql:8.4
    container_name: codialis-db-local
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: codialis
      MYSQL_USER: codialis
      MYSQL_PASSWORD: codialis_dev
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "codialis", "-pcodialis_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: codialis-backend-local
    environment:
      DATABASE_URL: mysql://codialis:codialis_dev@db:3306/codialis
      AUTH_SECRET: 9f3a1c7e5b2d80463a4b09591b952b13c39d4b68caa37058bea4b52f09ff1a9c
      NODE_ENV: production
      # Origines autorisées sur les routes publiques du site vitrine.
      CORS_ORIGINS: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    # La base locale part toujours vide : on applique le schéma avant de servir,
    # sinon chaque appel API répondrait 500. `migrate deploy` est idempotent.
    # En production, la commande reste manuelle (voir docker-compose.yml) : sur
    # une base déjà en service, elle exige un historique baseliné et un
    # crash-loop au démarrage serait pire qu'une étape explicite.
    command: sh -c "npx prisma migrate deploy && npx next start -p 3001"

  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: codialis-admin-local
    environment:
      # URL interne : le navigateur ne l'appelle jamais, seul le serveur Next
      # de frontend-admin s'y adresse.
      BACKEND_URL: http://backend:3001
      NODE_ENV: production
      # Pile locale en HTTP clair : sans cela le cookie de session serait
      # `Secure` et un navigateur le refuserait dès qu'on consulte la pile
      # autrement que par localhost (http://<ip>:3002).
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      - backend
    ports:
      - "3002:3002"

  frontend-public:
    image: httpd:2.4-alpine
    container_name: codialis-public-local
    depends_on:
      - backend
    ports:
      - "3001:80"
    volumes:
      - ./frontend-public:/usr/local/apache2/htdocs:ro
      - ./compose-proxy.conf:/usr/local/apache2/conf/extra/zz-proxy.conf:ro
    command:
      - sh
      - -c
      - >
        sed -i
        -e 's|^#\(LoadModule rewrite_module .*\)|\1|'
        -e 's|^#\(LoadModule headers_module .*\)|\1|'
        -e 's|^#\(LoadModule proxy_module .*\)|\1|'
        -e 's|^#\(LoadModule proxy_http_module .*\)|\1|'
        -e 's|AllowOverride None|AllowOverride All|g'
        conf/httpd.conf &&
        echo 'Include conf/extra/zz-proxy.conf' >> conf/httpd.conf &&
        httpd-foreground
