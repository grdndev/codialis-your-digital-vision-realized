# Pile de production derrière Traefik.
#
#   landingback.codialis.com  -> API (routes publiques du site + API admin)
#   admin.codialis.com        -> back-office (frontend-admin)
#
# Le site vitrine (frontend-public) est statique et hébergé séparément
# (Hostinger) : il n'apparaît pas ici, il appelle l'API en cross-origin.
#
# Le schéma n'est PAS appliqué au démarrage, à la différence de la pile locale.
# Sur une base déjà en service, `prisma migrate deploy` exige un historique
# baseliné (sinon P3005) : un crash-loop au boot serait pire qu'une étape
# explicite. Après chaque déploiement qui ajoute une migration :
#
#   docker compose exec codialis.backend npx prisma migrate deploy
services:
  codialis.db:
    image: mysql:8.4
    container_name: codialis-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: codialis
      MYSQL_USER: codialis
      MYSQL_PASSWORD: codialis_dev
    volumes:
      - codialis_mysqldata:/var/lib/mysql
    networks:
      proxy:
        aliases:
          - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "codialis", "-pcodialis_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  codialis.backend:
    build:
      context: ./backend
    container_name: codialis-api
    restart: unless-stopped
    depends_on:
      codialis.db:
        condition: service_healthy
      codialis.files:
        condition: service_started
    # Toute la configuration (DATABASE_URL, AUTH_SECRET, CORS_ORIGINS,
    # GOOGLE_API_KEY) vient de backend/.env, hors du dépôt. S'y ajoutent
    # FILES_TOKEN — la MÊME valeur que dans files/.env — et, si l'on veut
    # déroger aux défauts, FILES_INTERNAL_URL et FILES_PUBLIC_URL.
    env_file:
      - backend/.env
    networks:
      proxy:
        aliases:
          - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.codialis_api.rule=Host(`landingback.codialis.com`)"
      - "traefik.http.routers.codialis_api.entrypoints=websecure"
      - "traefik.http.routers.codialis_api.tls.certresolver=myresolver"
      - "traefik.http.services.codialis_api.loadbalancer.server.port=3001"

  codialis.admin:
    build:
      context: ./frontend-admin
    container_name: codialis-admin
    restart: unless-stopped
    depends_on:
      - codialis.backend
    environment:
      # Appel interne au réseau Docker : l'API n'a pas besoin d'être joignable
      # depuis l'extérieur pour que le back-office fonctionne. `api` est l'alias
      # réseau du service, plus sûr qu'un nom de service contenant un point.
      BACKEND_URL: http://api:3001
      NODE_ENV: production
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.codialis_admin.rule=Host(`admin.codialis.com`)"
      - "traefik.http.routers.codialis_admin.entrypoints=websecure"
      - "traefik.http.routers.codialis_admin.tls.certresolver=myresolver"
      - "traefik.http.services.codialis_admin.loadbalancer.server.port=3002"

  # Stockage de fichiers. Deux ports : 3003 en lecture publique (le seul déclaré
  # à Traefik) et 3004 en écriture, joint uniquement par codialis.backend.
  codialis.files:
    build:
      context: ./files
    container_name: codialis-files
    restart: unless-stopped
    # FILES_TOKEN, la même valeur que dans backend/.env. Hors du dépôt : c'est
    # la seule chose qui sépare les routes d'écriture des autres webapps de
    # l'agence, qui partagent toutes le réseau `proxy`.
    env_file:
      - files/.env
    volumes:
      - codialis_files:/app/public
    networks:
      proxy:
        aliases:
          # Alias plutôt que le nom du service : un nom contenant un point est
          # résolu de façon capricieuse (même raison que `api` et `db`).
          - files
    labels:
      # SEUL le port public est déclaré. Le port privé (3004) n'a aucun routeur,
      # il reste donc injoignable depuis Internet.
      - "traefik.enable=true"
      - "traefik.http.routers.codialis_files.rule=Host(`files.codialis.com`)"
      - "traefik.http.routers.codialis_files.entrypoints=websecure"
      - "traefik.http.routers.codialis_files.tls.certresolver=myresolver"
      - "traefik.http.services.codialis_files.loadbalancer.server.port=3003"

networks:
  proxy:
    external: true
volumes:
  codialis_mysqldata:
  codialis_files:
